# AWS Amplify Hosting build settings for the Next.js front end.
# Monorepo: Django lives at the repo root, the Next.js app in frontend/.
# The app is a static export (next.config.ts: output "export"), so Amplify only
# builds it and serves the files from its CDN; no Next.js server runs.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Use the Node version pinned in frontend/.nvmrc (24), the same as local.
            - nvm install
            - nvm use
            - node --version && npm --version
            # Exact install from package-lock.json; npm's download cache is kept between builds.
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        # Static export output: frontend/out
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*
