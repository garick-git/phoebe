# Production stack for the EC2 server. Local development uses compose.yaml instead.
#
# The server builds nothing. On every merge to main, GitHub Actions (deploy.yml)
# builds the web image, pushes it to ECR tagged with the commit SHA, and asks the
# server to deploy it (SSM document phoebe-deploy, deploy/ssm-phoebe-deploy.yaml).
# scripts/deploy.sh then copies this file, the Caddyfile and scripts/ out of that
# image into ~/phoebe and tags the image phoebe-web:live. See docs/operations.md.
#
# The project name is pinned: Compose names volumes after it (phoebe_postgres_data),
# so a different name, for example from running in another folder, would start
# Postgres on a new, empty volume.
name: phoebe

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    # A local tag on the server, never the ECR address (which contains the AWS
    # account ID; the repo is public). deploy.sh sets PHOEBE_WEB_IMAGE only to run
    # the migration on the new image before switching phoebe-web:live to it.
    image: ${PHOEBE_WEB_IMAGE:-phoebe-web:live}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
