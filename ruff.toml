# Ruff: the Python linter, run in CI (.github/workflows/ci.yml) and locally with
#   docker compose exec web ruff check .
# Ruff already skips everything in .gitignore (.venv, data/, node_modules).
target-version = "py313"

[lint]
# The standard set: pycodestyle errors (E4, E7, E9), pyflakes (F: unused
# imports, undefined names) and import order (I). Pinned on purpose: Ruff's
# wider defaults include RUF012, which flags every Django `fields = [...]` and
# `ordering = [...]` class attribute (a known false positive for Django).
select = ["E4", "E7", "E9", "F", "I"]
